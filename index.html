            outline: none;
        }

        

        /* MOVIES */

        .movies {
            width: 86%;

            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(190px, 1fr));

            gap: 25px;

        .movie {

            text-decoration: none;

        }

        .download:hover {
            background: #cc0000;
        }

        /* FOOTER */

        footer {
            text-align: center;
            color: #666;
            padding: 40px;
            margin-top: 50px;
        }

    </style>

</head>

    <!-- SEARCH -->

    <script>

        function searchMovie() {

            let search =
                document
                .getElementById("search")
                .value
                .toLowerCase();

            let movies =
                document
                .querySelectorAll(".movie");


            movies.forEach(function(movie) {

                let name =
                    movie
                    .querySelector("h3")
                    .innerText
                    .toLowerCase();


                if (name.includes(search)) {

                    movie.style.display = "block";

                } else {

                    movie.style.display = "none";

                }

            });

        }

    </script>
